name: release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag name (e.g. v2.12.0)
        required: true
      title:
        description: Release title
        required: true
      body:
        description: Release body (markdown)
        required: true
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ inputs.tag }}" --title "${{ inputs.title }}" --notes "${{ inputs.body }}"
